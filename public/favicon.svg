<svg width="400" height="400" viewBox="0 0 400 400" xmlns="http://www.w3.org/2000/svg" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f0c29"/>
      <stop offset="100%" stop-color="#1a1533"/>
    </linearGradient>
    <linearGradient id="textGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#a855f7"/>
      <stop offset="50%" stop-color="#6366f1"/>
      <stop offset="100%" stop-color="#22d3ee"/>
    </linearGradient>
    <linearGradient id="ringGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#a855f7" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#22d3ee" stop-opacity="0.9"/>
    </linearGradient>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="400" height="400" rx="56" fill="url(#bgGrad)"/>

  <!-- subtle dot accents -->
  <circle cx="60" cy="70" r="2.5" fill="#a855f7" opacity="0.5"/>
  <circle cx="340" cy="90" r="2" fill="#22d3ee" opacity="0.5"/>
  <circle cx="330" cy="330" r="2.5" fill="#6366f1" opacity="0.5"/>
  <circle cx="55" cy="320" r="2" fill="#a855f7" opacity="0.4"/>

  <!-- Outer angled ring -->
  <circle cx="200" cy="200" r="140" fill="none" stroke="url(#ringGrad)" stroke-width="2.5" opacity="0.55"/>
  <circle cx="200" cy="200" r="152" fill="none" stroke="url(#ringGrad)" stroke-width="1" opacity="0.25"/>

  <!-- Monogram KK -->
  <text x="200" y="248" font-family="Arial, Helvetica, sans-serif" font-weight="800"
        font-size="150" text-anchor="middle" fill="url(#textGrad)" letter-spacing="-6"
        filter="url(#glow)">KK</text>

  <!-- underline accent -->
  <rect x="128" y="272" width="144" height="5" rx="2.5" fill="url(#textGrad)" opacity="0.9"/>
</svg>
